# Local learning configuration. Set credentials in the shell before starting.
server:
  address: 127.0.0.1
spring:
  application:
    name: tlias-web-management
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/tlias_learning}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug
aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
    bucketName: ${OSS_BUCKET_NAME:example-bucket}
    region: ${OSS_REGION:cn-beijing}
